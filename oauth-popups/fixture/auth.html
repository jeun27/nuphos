<!doctype html><html><head><meta charset="utf-8"><title>Sign In – Fixture Account</title>
<style>body{font:15px -apple-system,system-ui,sans-serif;margin:0;padding:28px;background:#fff;color:#222}
button{padding:10px 18px;border-radius:6px;border:0;background:#1a73e8;color:#fff;font:inherit;cursor:pointer}#err{color:#b3261e}</style></head><body>
<h3>Choose an account</h3><p>to continue to Fixture App</p>
<button id="pick">test-user@example.test</button><p id="err"></p>
<script>
document.getElementById('pick').onclick = () => {
  if (!window.opener) { document.getElementById('err').textContent = 'No window.opener: this page was not opened as a popup, so it cannot hand the sign-in back.'; return }
  window.opener.postMessage({ type: 'signed-in', user: 'test-user@example.test' }, '*')
  setTimeout(() => window.close(), 300)
}
if (!window.opener) document.getElementById('err').textContent = 'No window.opener: this page was not opened as a popup, so it cannot hand the sign-in back.'
</script></body></html>
